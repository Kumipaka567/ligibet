<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#050507" rx="24"/>
  <g transform="translate(10, -20)">
    <!-- PROPELLER PLANE LOGO SILHOUETTE (RED ACCENT) -->
    <g transform="translate(250, 195) rotate(-18)" fill="#ff1744">
      <!-- Fuselage -->
      <path d="M-110,15 C-80,-10 -20,-25 60,-22 C110,-20 135,-12 145,-2 C150,3 148,12 135,18 C110,28 40,32 -40,28 C-85,25 -105,20 -110,15 Z" />
      <!-- Cockpit windshield -->
      <path d="M-10,-20 C5,-35 30,-38 48,-24 C35,-22 10,-20 -10,-20 Z" fill="#050507"/>
      <!-- Main Wing -->
      <path d="M-35,5 L-95,68 C-102,75 -112,75 -110,62 L-75,-5 Z" />
      <path d="M15,-18 L25,-85 C28,-95 38,-92 42,-82 L45,-15 Z" />
      <!-- Tail fin -->
      <path d="M-88,10 L-135,-32 C-142,-38 -135,-45 -125,-40 L-72,0 Z" />
      <!-- Engine Nose Cone -->
      <path d="M140,-5 C155,-3 162,2 160,8 C155,14 140,15 135,12 Z" />
      <!-- Propeller Blade -->
      <path d="M152,5 C175,-35 190,-75 182,-82 C174,-88 155,-50 148,5 Z" />
      <path d="M152,5 C162,45 178,85 170,90 C162,94 148,55 145,5 Z" />
    </g>

    <!-- SCRIPT TEXT "Aviator" -->
    <text x="250" y="365" 
          font-family="'Brush Script MT', 'Pacifico', 'Caveat', 'Dancing Script', 'Segoe Script', cursive, sans-serif" 
          font-size="108" 
          font-weight="900" 
          font-style="italic" 
          fill="#ff1744" 
          text-anchor="middle" 
          letter-spacing="-1">
      Aviator
    </text>

    <!-- DOUBLE RED UNDERLINE BARS -->
    <rect x="200" y="392" width="100" height="8" rx="4" fill="#ff1744"/>
    <rect x="225" y="408" width="50" height="6" rx="3" fill="#ff1744"/>
  </g>
</svg>
